# /etc/nginx/sites-available/fk-dashboard.conf
# ln -s /etc/nginx/sites-available/fk-dashboard.conf /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d dashboard.example.ru  (сам допишет 443-й блок)

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.ru;   # ← подставь свой домен или IP ВМ

    access_log /var/log/nginx/fk-dashboard.access.log;
    error_log  /var/log/nginx/fk-dashboard.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Ограничитель: дашборд публичный, но флудить его не дадим.
    limit_req zone=fkdash burst=40 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Если позже захочешь закрыть доступ — раскомментируй один из блоков:
    #
    # 1) По списку IP:
    # location / {
    #     allow 203.0.113.10;
    #     allow 198.51.100.0/24;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8090;
    # }
    #
    # 2) По паролю (htpasswd -c /etc/nginx/.htpasswd fk):
    # auth_basic "FK dashboard";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
