services:
  fk-dashboard:
    build: .
    image: fk-dashboard:latest
    container_name: fk-dashboard
    restart: unless-stopped
    env_file: .env
    # Наружу не публикуем: слушаем только localhost, снаружи ходит nginx.
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
