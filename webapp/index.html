const eq=['cromaster','starline','Glimek','König / König хлеб','Rondo','Trima'],groups=['Холодная формовка','Тёплая формовка'];const products={'Холодная формовка':['Булочка бриошь зерновая','Булочка ржаная','Булочка с корицей','Булочка Сладкое сердце','Венгерская ватрушка','Круассан для сэндвича','Круассан классика мини 55 г','Круассан мини 50 г','Круассан французский 70 г','Круассан французский без дефроста','Круассан французский с сыром','Лепёшка сдобная','Лепёшка сдобная с сосиской','Начинка булочка с корицей','Начинка для пирожков с курицей и сыром','Начинка маковая для улитки','Основа для слойки с вишней','Пирожок с курицей и сыром','Рогалик вишнёвый','Слойка голландская','Слойка с вишней и заварным кремом','Слойка с марсельской сосиской','Слойка шоколад-апельсин','Творожные ушки','Трубочка','Улитка с изюмом','Улитка с маком','Хачапури','Хлеб Бородинский'],'Тёплая формовка':['Багет злаковый','Багет молочный','Багет ремесленный на опаре','Багет сырный','Батон классический','Бейгл с кунжутом','Булка Много мака','Булочка для гамбургера без кунжута','Булочка для супа тёмная','Булочка для френч-дога','Булочка для хот-дога белая','Булочка с маком','Булочка суповая светлая','Мини-чиабатта','Краюшки','Пирожок с капустой фреш','Пирожок с мясом фреш','Ромовая баба','Сочник с творогом','Хлеб бездрожжевой с семечками','Хлеб злаковый','Хлеб картофельный','Хлеб кефирный','Хлеб протеиновый','Хлеб пшеничный домашний','Хлеб с семенами чиа и пажитником','Хлеб тартин ржано-пшеничный','Хлеб тартин розовый','Хлеб тостовый молочный','Хлеб тостовый слоёный фреш','Хлеб тыквенный','Хлеб чесночный','Чиабатта пшеничная смесевая']};const reasons=['Поломка оборудования','Нет сырья','Нет персонала','Техническая проблема','Качество продукции'];let s={};const C=()=>document.getElementById('content'),clear=()=>C().innerHTML='',B=(t,f,c='')=>{const b=document.createElement('button');b.type='button';b.className='btn '+c;b.textContent=t;b.addEventListener('click',f);return b},back=()=>C().append( function render(){clear();if(!s.event){C().append(document.createTextNode('Выберите действие'),B('🟢 Начало производства',()=>pick('event','start'),'primary'),B('🏁 Завершение производства',startFinish,'primary'),B('🔴 Критическая остановка',()=>pick('event','pause'),'danger'),B('📈 Аналитика',dashboard,'primary'));return}if(s.event==='finish'&&!s.openLoaded)return loadOpen();if(s.event==='finish'&&!s.openSelected)return renderOpen();if(!s.equipment){back();C().append(document.createTextNode('🏭 Выберите оборудование'));eq.forEach(x=>C().append(B(x,()=>pick('equipment',x))));return}if(s.event==='pause'&&!s.reason){back();C().append(document.createTextNode('❓ Причина остановки'));reasons.forEach(x=>C().append(B(x,()=>pick('reason',x))));return}if(s.event!=='pause'&&!s.group){back();C().append(document.createTextNode('📦 Вид формовки'));groups.forEach(x=>C().append(B(x,()=>pick('group',x))));return}if(s.event!=='pause'&&!s.product){back();const i=document.createElement('input');i.id='q';i.className='search';i.placeholder='Поиск продукции';i.oninput=search;C().append(i);const r=document.createElement('div');r.id='r';C().append(r);search();return}if(s.event==='start'&&!s.start){time('start','🕐 Начало производства');return}if(s.event==='pause'&&!s.start){time('start','🕐 Начало остановки');return}if(s.event==='pause'&&!s.end){time('end','🕐 Окончание остановки');return}if(s.event==='finish'&&!s.quantity){renderQuantity();return}if(s.event==='finish'&&!s.end){time('end','🕐 Окончание производства');return}confirmScreen()}

async function loadOpen(){try{const r=await fetch('/api/open',{headers:H(),cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка доступа');s.open=x.items||[];s.openLoaded=true;s.openSelected=false;delete s.error;renderOpen()}catch(e){s.openLoaded=true;s.error=e.message;renderOpen()}}function selectOpen(x){s.openSelected=true;s.open_id=String(x.id);s.equipment=x.equipment;s.group=x.forming;s.product=x.product;s.start=x.start_time;delete s.open;delete s.error;render()}function renderOpen(){clear();C().append(document.createTextNode('🏁 Выберите открытое производство'),document.createElement('br'));if(s.error){C().append(document.createTextNode('⚠️ '+s.error),B('← Назад',()=>{s={};render()}));return}if(!s.open?.length){C().append(document.createTextNode('Открытых производств нет.'));C().append(B('← Назад',()=>{s={};render()}));return}s.open.forEach(x=>{const b=B('📦 '+x.product+' · '+x.equipment+' · '+x.start_time,()=>selectOpen(x),'item');b.setAttribute('aria-label','Выбрать '+x.product);C().append(b)});C().append(B('← Назад',()=>{s={};render()}))}

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const n=x=>Number(x||0).toLocaleString('ru-RU');const dur=(a,b)=>{if(!a||!b)return 0;const p=v=>{const z=String(v).split(':').map(Number);return z[0]*60+z[1]};let d=p(b)-p(a);return d<0?d+1440:d};const dh=m=>{m=Math.round(m||0);return m<60?m+' мин':Math.floor(m/60)+' ч '+m%60+' мин'};

function drawDash(d){const prod=d.production||[],pause=d.pauses||[];const closed=prod.filter(x=>x.status==='closed');const total=closed.reduce((a,x)=>a+Number(x.quantity||0),0);const times=closed.map(x=>dur(x.start_time,x.end_time)).filter(Boolean);const avg=times.length?times.reduce((a,b)=>a+b,0)/times.length:0;const down=pause.map(x=>dur(x.start_time,x.end_time)).reduce((a,b)=>a+b,0);const rate=avg?total/(avg/60):0;const eq={};closed.forEach(x=>eq[x.equipment]=(eq[x.equipment]||0)+Number(x.quantity||0));const es=Object.entries(eq).sort((a,b)=>b[1]-a[1]).slice(0,8);const mx=Math.max(1,...es.map(x=>x[1]));const ps={};closed.forEach(x=>{const k=x.product||'Без продукта';if(!ps[k])ps[k]={q:0,n:0,t:0};ps[k].q+=Number(x.quantity||0);ps[k].n++;ps[k].t+=dur(x.start_time,x.end_time)});const top=Object.entries(ps).sort((a,b)=>b[1].q-a[1].q).slice(0,10);const pm=Math.max(1,...top.map(x=>x[1].q));const rs={};pause.forEach(x=>rs[x.reason]=(rs[x.reason]||0)+dur(x.start_time,x.end_time));const stops=Object.entries(rs).sort((a,b)=>b[1]-a[1]);C().innerHTML='<div class="dash"><div class="dashHead"><div><div class="dashTitle">Производство</div><div class="small">Данные PostgreSQL · обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</div></div><button class="back" id="db">←</button></div><div class="filters"><select id="dp"><option value="all">Весь период</option><option value="7">7 дней</option><option value="30">30 дней</option></select><select id="de"><option value="all">Все оборудование</option></select></div><div class="kpis"><div class="kpi">📦 Выпуск<b>'+n(total)+' шт</b></div><div class="kpi">🔄 Циклы<b>'+n(closed.length)+'</b></div><div class="kpi">⏱ Средний цикл<b>'+dh(avg)+'</b></div><div class="kpi">⚡ Производительность<b>'+n(Math.round(rate))+' шт/ч</b></div><div class="kpi">🛑 Простои<b>'+dh(down)+'</b></div></div><div class="section"><h3>🏭 Выпуск по оборудованию</h3><div class="bars">'+(es.length?es.map(x=>'<div class="bw"><div class="b
