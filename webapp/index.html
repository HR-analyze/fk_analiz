<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Производство</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}.app{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #0001}.btn{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;background:#eee;font-size:16px;text-align:left}.primary{background:#222;color:#fff}.danger{background:#f5dddd}.muted{color:#777}.search{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.hidden{display:none}.result{padding:13px;border-bottom:1px solid #eee;cursor:pointer}</style></head><body><div class="app"><div class="card"><h2 id="title">📊 Производство</h2><div id="content"></div></div></div><script>const tg=window.Telegram?.WebApp; tg?.ready();tg?.expand();const products={"Холодная формовка":["Булочка бриошь зерновая","Булочка ржаная","Булочка с корицей","Булочка Сладкое сердце","Венгерская ватрушка","Круассан для сэндвича","Круассан классика мини 55 г","Круассан мини 50 г","Круассан французский 70 г","Круассан французский без дефроста","Круассан французский с сыром","Лепёшка сдобная","Лепёшка сдобная с сосиской","Начинка булочка с корицей","Начинка для пирожков с курицей и сыром","Начинка маковая для улитки","Основа для слойки с вишней","Пирожок с курицей и сыром","Рогалик вишнёвый","Слойка голландская","Слойка с вишней и заварным кремом","Слойка с марсельской сосиской","Слойка шоколад-апельсин","Творожные ушки","Трубочка","Улитка с изюмом","Улитка с маком","Хачапури","Хлеб Бородинский"],"Тёплая формовка":["Багет злаковый","Багет молочный","Багет ремесленный на опаре","Багет сырный","Батон классический","Бейгл с кунжутом","Булка Много мака","Булочка для гамбургера без кунжута","Булочка для супа тёмная","Булочка для френч-дога","Булочка для хот-дога белая","Булочка с маком","Булочка суповая светлая","Мини-чиабатта","Краюшки","Пирожок с капустой фреш","Пирожок с мясом фреш","Ромовая баба","Сочник с творогом","Хлеб бездрожжевой с семечками","Хлеб злаковый","Хлеб картофельный","Хлеб кефирный","Хлеб протеиновый","Хлеб пшеничный домашний","Хлеб с семенами чиа и пажитником","Хлеб тартин ржано-пшеничный","Хлеб тартин розовый","Хлеб тостовый молочный","Хлеб тостовый слоёный фреш","Хлеб тыквенный","Хлеб чесночный","Чиабатта пшеничная смесевая"]};let state={};const equipment=['cromaster','starline','Glimek','König / König хлеб','Rondo','Trima'];function render(){let c=document.getElementById('content');if(!state.event){c.innerHTML='<p>Что нужно записать?</p>'+btn('🟢 Начало производства',()=>pick('event','start'))+btn('🏁 Завершение производства',()=>pick('event','finish'))+btn('🔴 Критическая остановка',()=>pick('event','pause'));return}if(!state.equipment){c.innerHTML='<p>🏭 Выберите оборудование</p>'+equipment.map(x=>btn(x,()=>pick('equipment',x))).join('')+btn('✏️ Другое',()=>text('equipment'));return}if(!state.group){c.innerHTML='<p>📦 Выберите вид формовки</p>'+Object.keys(products).map(x=>btn(x,()=>pick('group',x))).join('');return}if(!state.product){c.innerHTML='<p>🔎 Найдите продукцию</p><input id="q" class="search" placeholder="Например: хлеб, круассан, бейгл" oninput="search()"><div id="results"></div>'+btn('✏️ Другое',()=>text('product'));return}if(!state.start){c.innerHTML='<p>🕐 Когда начали?</p>'+btn('🕐 Сейчас',()=>pick('start',now()))+'<input id="t" class="search" placeholder="Например 08:30">'+btn('Продолжить',()=>manual('start'));return}if(state.event==='finish'&&!state.quantity){c.innerHTML='<p>🔢 Сколько штук произвели?</p><input id="n" class="search" inputmode="numeric" placeholder="Например 8280">'+btn('Продолжить',()=>manual('quantity'));return}if(state.event==='pause'&&!state.end){c.innerHTML='<p>🕐 Когда закончилась остановка?</p>'+btn('🕐 Сейчас',()=>pick('end',now()))+'<input id="t" class="search" placeholder="Например 09:45">'+btn('Продолжить',()=>manual('end'));return}if(state.event==='pause'&&!state.reason){c.innerHTML='<p>❓ Почему произошла остановка?</p>'+['Поломка оборудования','Нет сырья','Нет персонала','Техническая проблема','Качество продукции'].map(x=>btn(x,()=>pick('reason',x))).join('')+btn('✏️ Другая причина',()=>text('reason'));return}c.innerHTML='<p>Проверьте запись:</p><div>'+summary()+'</div>'+btn('✅ Всё верно — отправить',send)+btn('✏️ Начать заново',()=>{state={};render()});}function btn(t,f){return `<button class="btn" onclick="(${f.toString()})()">${t}</button>`}function pick(k,v){state[k]=v;render()}function now(){return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',hour12:false})}function manual(k){let v=k==='quantity'?document.getElementById('n').value:document.getElementById('t').value;if(k!=='quantity'&&!/^\d{1,2}:\d{2}$/.test(v)){alert('Напишите время в формате 08:30');return}if(k==='quantity'&&!/^\d+$/.test(v.replace(/\s/g,''))){alert('Напишите количество цифрами, например 8280');return}state[k]=v.replace(/\s/g,'');render()}function text(k){let v=prompt(k==='equipment'?'Напишите название оборудования:':k==='product'?'Напишите название продукции:':'Напишите причину остановки:');if(v?.trim())pick(k,v.trim())}function search(){let q=document.getElementById('q').value.toLowerCase().trim();document.getElementById('results').innerHTML=(products[state.group]||[]).filter(x=>x.toLowerCase().includes(q)).slice(0,12).map(x=>`<div class="result" onclick="pick('product','${x.replace(/'/g,"\\'")}')">${x}</div>`).join('')||'<p class="muted">Ничего не нашли. Попробуйте другое слово.</p>'}function summary(){if(state.event==='start')return `🟢 Начало производства<br>🏭 ${state.equipment}<br>📦 ${state.product}<br>🕐 Старт: ${state.start}`;if(state.event==='finish')return `🏁 Завершение производства<br>🏭 ${state.equipment}<br>📦 ${state.product}<br>🕐 Стоп: ${state.start}<br>🔢 Количество: ${state.quantity} шт`;return `🔴 Критическая остановка<br>🏭 ${state.equipment}<br>📦 ${state.product}<br>🕐 С ${state.start} до ${state.end}<br>❓ ${state.reason}`}function send(){tg?.sendData(JSON.stringify(state));document.getElementById('content').innerHTML='<h3>✅ Готово</h3><p>Данные отправлены. В чат попадёт только итоговая запись.</p>'}render();</script></body></html>
