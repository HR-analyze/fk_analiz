<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ФК — производство</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f4f5;color:#222}.app{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:20px}.btn{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;background:#eee;font-size:16px;text-align:left;cursor:pointer}.primary{background:#222;color:#fff}.danger{background:#f5dddd}.search{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.item{padding:14px 4px;border-bottom:1px solid #eee;cursor:pointer}.ok{background:#e8f7e8;padding:14px;border-radius:10px}.err{background:#fee;padding:14px;border-radius:10px}</style></head><body><div class="app"><div class="card"><h2>📊 ФК — производство</h2><div id="content"></div></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const initData=tg?.initData||'';const user=tg?.initDataUnsafe?.user||{};const H=()=>{const h={'Content-Type':'application/json'};if(initData)h['X-Telegram-Init-Data']=initData;if(user.id)h['X-Telegram-User-Id']=String(user.id);if(user.first_name)h['X-Telegram-User-Name']=user.first_name+(user.last_name?' '+user.last_name:'');return h};
const eq=['cromaster','starline','Glimek','König / König хлеб','Rondo','Trima'];const groups=['Холодная формовка','Тёплая формовка'];const products={'Холодная формовка':['Булочка бриошь зерновая','Булочка ржаная','Булочка с корицей','Булочка Сладкое сердце','Венгерская ватрушка','Круассан для сэндвича','Круассан французский 70 г','Круассан французский с сыром','Лепёшка сдобная','Пирожок с курицей и сыром','Слойка с вишней и заварным кремом','Улитка с маком','Хачапури','Хлеб Бородинский'],'Тёплая формовка':['Багет злаковый','Багет молочный','Багет ремесленный на опаре','Багет сырный','Батон классический','Бейгл с кунжутом','Булочка для гамбургера без кунжута','Булочка для хот-дога белая','Мини-чиабатта','Пирожок с капустой фреш','Пирожок с мясом фреш','Ромовая баба','Сочник с творогом','Хлеб злаковый','Хлеб картофельный','Хлеб кефирный','Хлеб пшеничный домашний','Хлеб тостовый молочный','Хлеб тыквенный','Хлеб чесночный','Чиабатта пшеничная смесевая']};const reasons=['Поломка оборудования','Нет сырья','Нет персонала','Техническая проблема','Качество продукции'];let s={};const C=()=>document.getElementById('content');const clear=()=>C().innerHTML='';const B=(t,f,c='')=>{const b=document.createElement('button');b.type='button';b.className='btn '+c;b.textContent=t;b.addEventListener('click',f);return b};const back=()=>C().append(B('← Назад',()=>{s={};render()}));const pick=(k,v)=>{s[k]=v;render()};const now=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
function render(){clear();if(!s.event){C().append(document.createTextNode('Выберите действие'),B('🟢 Начало производства',()=>pick('event','start'),'primary'),B('🏁 Завершение производства',()=>pick('event','finish'),'primary'),B('🔴 Критическая остановка',()=>pick('event','pause'),'danger'));return}if(s.event==='finish'&&!s.openLoaded){loadOpen();return}if(!s.equipment){back();C().append(document.createTextNode('🏭 Выберите оборудование'));eq.forEach(x=>C().append(B(x,()=>pick('equipment',x))));return}if(s.event==='pause'&&!s.reason){back();C().append(document.createTextNode('❓ Причина остановки'));reasons.forEach(x=>C().append(B(x,()=>pick('reason',x))));return}if(s.event!=='pause'&&!s.group){back();C().append(document.createTextNode('📦 Вид формовки'));groups.forEach(x=>C().append(B(x,()=>pick('group',x))));return}if(s.event!=='pause'&&!s.product){back();const i=document.createElement('input');i.id='q';i.className='search';i.placeholder='Поиск продукции';i.addEventListener('input',search);C().append(i);const r=document.createElement('div');r.id='r';C().append(r);search();return}if(s.event==='pause'&&!s.start){time('start','🕐 Начало остановки');return}if(s.event==='pause'&&!s.end){time('end','🕐 Окончание остановки');return}if(s.event==='start'&&!s.start){time('start','🕐 Начало производства');return}if(s.event==='finish'&&!s.end){time('end','🕐 Окончание производства');return}if(s.event==='finish'&&!s.quantity){back();C().append(document.createTextNode('🔢 Количество'));const i=document.createElement('input');i.id='quantity';i.className='search';i.inputMode='numeric';i.placeholder='3000';C().append(i,B('Продолжить',()=>{if(!/^\d+$/.test(i.value)||+i.value<=0)return alert('Введите количество');s.quantity=i.value;render()},'primary'));return}C().append(document.createTextNode('Проверьте запись'),document.createElement('br'),document.createTextNode(summary()),B('✅ Подтвердить',send,'primary'))}
function time(k,t){back();C().append(document.createTextNode(t),B('🕐 Сейчас',()=>pick(k,now()),'primary'));const i=document.createElement('input');i.id=k+'i';i.className='search';i.placeholder='08:30';C().append(i,B('Продолжить',()=>{if(!/^\d{1,2}:\d{2}$/.test(i.value))return alert('Формат 08:30');s[k]=i.value;render()}))}function search(){const q=(document.getElementById('q')?.value||'').toLowerCase(),r=document.getElementById('r');if(!r)return;r.innerHTML='';(products[s.group]||[]).filter(x=>x.toLowerCase().includes(q)).forEach(x=>{const d=document.createElement('div');d.className='item';d.textContent=x;d.addEventListener('click',()=>pick('product',x));r.append(d)})}
async function loadOpen(){s.openLoaded=true;try{const r=await fetch('/api/open',{headers:H()});const x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка доступа');s.open=x.items||[]}catch(e){s.error=e.message}renderOpen()}function renderOpen(){clear();back();if(s.error){C().append(document.createTextNode('⚠️ '+s.error));return}if(!s.open.length){C().append(document.createTextNode('Открытых производств нет.'));return}C().append(document.createTextNode('🏁 Выберите открытое производство'));s.open.forEach((x,i)=>C().append(B('📦 '+x.product+' · '+x.equipment+' · '+x.start_time,()=>{s={event:'finish',open_id:x.id,equipment:x.equipment,group:x.forming,product:x.product,start:x.start_time,end:now()};render()},'primary')))}function summary(){if(s.event==='start')return `🟢 Начало: ${s.equipment} · ${s.product} · ${s.start}`;if(s.event==='pause')return `🔴 Остановка: ${s.equipment} · ${s.reason} · ${s.start}–${s.end}`;return `🏁 Завершение: ${s.equipment} · ${s.product} · ${s.start}–${s.end} · ${Number(s.quantity).toLocaleString('ru-RU')} шт`}
async function send(){try{const r=await fetch('/api/save',{method:'POST',headers:H(),body:JSON.stringify(s)});const x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка сохранения');s={};clear();C().append(document.createElement('h3')).textContent='✅ Готово';C().append(document.createTextNode('Запись сохранена и отправлена в рабочую группу.'),B('Вернуться в меню',render,'primary'))}catch(e){clear();C().append(document.createTextNode('⚠️ '+e.message),B('← Назад',render))}}render();</script></body></html>
