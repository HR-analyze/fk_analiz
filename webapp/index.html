<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>ФК — производство</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f4f5;color:#222}.app{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:20px}.btn{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;background:#eee;font-size:16px;text-align:left;cursor:pointer;touch-action:manipulation}.primary{background:#222;color:#fff}.danger{background:#f5dddd}.search{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.item{display:block;width:100%;box-sizing:border-box;padding:14px;margin:6px 0;border:1px solid #ddd;border-radius:10px;background:#fff;text-align:left;font-size:16px;cursor:pointer}.ok{background:#e8f7e8;padding:14px;border-radius:10px}.err{background:#fee;padding:14px;border-radius:10px}</style></head><body><div class="app"><div class="card"><h2>📊 ФК — производство</h2><div id="content"></div></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const tu=tg?.initDataUnsafe?.user||{};let clientId=tu.id?String(tu.id):localStorage.getItem('fk_client_id');if(!clientId){clientId=String(Date.now())+String(Math.floor(Math.random()*100000));localStorage.setItem('fk_client_id',clientId)}const clientName=tu.id?((tu.first_name||'')+(tu.last_name?' '+tu.last_name:'')):'Сотрудник';function H(){const h={'Content-Type':'application/json','X-Telegram-User-Id':clientId};if(clientName)h['X-Telegram-User-Name']=clientName;if(tg?.initData)h['X-Telegram-Init-Data']=tg.initData;return h}
const eq=['cromaster','starline','Glimek','König / König хлеб','Rondo','Trima'],groups=['Холодная формовка','Тёплая формовка'];const products={'Холодная формовка':['Булочка бриошь зерновая','Булочка ржаная','Булочка с корицей','Булочка Сладкое сердце','Венгерская ватрушка','Круассан для сэндвича','Круассан классика мини 55 г','Круассан мини 50 г','Круассан французский 70 г','Круассан французский без дефроста','Круассан французский с сыром','Лепёшка сдобная','Лепёшка сдобная с сосиской','Начинка булочка с корицей','Начинка для пирожков с курицей и сыром','Начинка маковая для улитки','Основа для слойки с вишней','Пирожок с курицей и сыром','Рогалик вишнёвый','Слойка голландская','Слойка с вишней и заварным кремом','Слойка с марсельской сосиской','Слойка шоколад-апельсин','Творожные ушки','Трубочка','Улитка с изюмом','Улитка с маком','Хачапури','Хлеб Бородинский'],'Тёплая формовка':['Багет злаковый','Багет молочный','Багет ремесленный на опаре','Багет сырный','Батон классический','Бейгл с кунжутом','Булка Много мака','Булочка для гамбургера без кунжута','Булочка для супа тёмная','Булочка для френч-дога','Булочка для хот-дога белая','Булочка с маком','Булочка суповая светлая','Мини-чиабатта','Краюшки','Пирожок с капустой фреш','Пирожок с мясом фреш','Ромовая баба','Сочник с творогом','Хлеб бездрожжевой с семечками','Хлеб злаковый','Хлеб картофельный','Хлеб кефирный','Хлеб протеиновый','Хлеб пшеничный домашний','Хлеб с семенами чиа и пажитником','Хлеб тартин ржано-пшеничный','Хлеб тартин розовый','Хлеб тостовый молочный','Хлеб тостовый слоёный фреш','Хлеб тыквенный','Хлеб чесночный','Чиабатта пшеничная смесевая']};const reasons=['Поломка оборудования','Нет сырья','Нет персонала','Техническая проблема','Качество продукции'];let s={};const C=()=>document.getElementById('content'),clear=()=>C().innerHTML='',B=(t,f,c='')=>{const b=document.createElement('button');b.type='button';b.className='btn '+c;b.textContent=t;b.onclick=f;return b},back=()=>C().append(B('← Назад',()=>{s={};render()})),pick=(k,v)=>{s[k]=v;render()},now=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
function render(){clear();if(!s.event){C().append(document.createTextNode('Выберите действие'),B('🟢 Начало производства',()=>pick('event','start'),'primary'),B('🏁 Завершение производства',()=>{s={event:'finish'};loadOpen()},'primary'),B('🔴 Критическая остановка',()=>pick('event','pause'),'danger'));return}if(s.event==='finish'&&!s.openLoaded)return loadOpen();if(s.event==='finish'&&!s.openSelected)return renderOpen();if(!s.equipment){back();C().append(document.createTextNode('🏭 Выберите оборудование'));eq.forEach(x=>C().append(B(x,()=>pick('equipment',x))));return}if(s.event==='pause'&&!s.reason){back();C().append(document.createTextNode('❓ Причина остановки'));reasons.forEach(x=>C().append(B(x,()=>pick('reason',x))));return}if(s.event!=='pause'&&!s.group){back();C().append(document.createTextNode('📦 Вид формовки'));groups.forEach(x=>C().append(B(x,()=>pick('group',x))));return}if(s.event!=='pause'&&!s.product){back();const i=document.createElement('input');i.id='q';i.className='search';i.placeholder='Поиск продукции';i.oninput=search;C().append(i);const r=document.createElement('div');r.id='r';C().append(r);search();return}if(s.event==='start'&&!s.start){time('start','🕐 Начало производства');return}if(s.event==='pause'&&!s.start){time('start','🕐 Начало остановки');return}if(s.event==='pause'&&!s.end){time('end','🕐 Окончание остановки');return}if(s.event==='finish'&&!s.quantity){back();C().append(document.createTextNode('🔢 Сколько штук произвели?'));const i=document.createElement('input');i.id='quantity';i.className='search';i.inputMode='numeric';i.placeholder='3000';C().append(i,B('Продолжить',()=>{const v=i.value.replace(/\s/g,'');if(!/^\d+$/.test(v)||+v<=0)return alert('Введите количество');s.quantity=v;render()},'primary'));return}if(s.event==='finish'&&!s.end){time('end','🕐 Окончание производства');return}confirmScreen()}
function time(k,t){back();C().append(document.createTextNode(t),B('🕐 Сейчас',()=>pick(k,now()),'primary'));const i=document.createElement('input');i.className='search';i.placeholder='08:30';C().append(i,B('Продолжить',()=>{if(!/^\d{1,2}:\d{2}$/.test(i.value))return alert('Формат 08:30');s[k]=i.value;render()}))}function search(){const q=(document.getElementById('q')?.value||'').toLowerCase(),r=document.getElementById('r');if(!r)return;r.innerHTML='';(products[s.group]||[]).filter(x=>x.toLowerCase().includes(q)).forEach(x=>r.append(B('📦 '+x,()=>pick('product',x),'item')))}
async function loadOpen(){s.openLoaded=true;try{const r=await fetch('/api/open',{headers:H(),cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка доступа');s.open=x.items||[]}catch(e){s.error=e.message}s.openSelected=false;renderOpen()}function renderOpen(){clear();if(s.error){C().append(document.createTextNode('⚠️ '+s.error),B('← Назад',()=>{s={};render()}));return}C().append(document.createTextNode('🏁 Выберите открытое производство'));if(!s.open?.length){C().append(document.createElement('br'),document.createTextNode('Открытых производств нет.'))}else s.open.forEach(x=>C().append(B('📦 '+x.product+' · '+x.equipment+' · '+x.start_time,()=>{s={event:'finish',openSelected:true,open_id:String(x.id),equipment:x.equipment,group:x.forming,product:x.product,start:x.start_time};render()},'item')));C().append(B('← Назад',()=>{s={};render()}))}
function confirmScreen(){const text=s.event==='start'?`🟢 Начало: ${s.equipment} · ${s.product} · ${s.start}`:s.event==='pause'?`🔴 Остановка: ${s.equipment} · ${s.reason} · ${s.start}–${s.end}`:`🏁 Завершение: ${s.equipment} · ${s.product} · ${s.start}–${s.end} · ${Number(s.quantity).toLocaleString('ru-RU')} шт`;C().append(document.createTextNode('Проверьте запись'),document.createElement('br'),document.createTextNode(text),B('✅ Подтвердить',send,'primary'))}async function send(){try{const r=await fetch('/api/save',{method:'POST',headers:H(),body:JSON.stringify(s),cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка сохранения');s={};clear();C().append(document.createTextNode('✅ Запись сохранена'),document.createElement('br'),document.createTextNode('Итог отправлен в рабочую группу.'),B('Вернуться в меню',render,'primary'))}catch(e){clear();C().append(document.createTextNode('⚠️ Не удалось сохранить: '+e.message),B('← Назад',render))}}render();</script></body></html>
