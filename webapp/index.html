<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>ФК — производство</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--bg:#f4f5f7;--card:#fff;--text:#17181a;--muted:#777b82;--line:#e7e8eb;--good:#18a66a;--warn:#e5a51b;--bad:#e24b4b;--accent:#222}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}.app{max-width:720px;margin:auto;padding:12px}.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 2px 12px #0000000a}.btn{width:100%;padding:15px;margin:6px 0;border:0;border-radius:13px;background:#eee;font-size:16px;text-align:left;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.primary{background:#222;color:#fff}.danger{background:#fbe1e1}.item{display:block;width:100%;box-sizing:border-box;padding:15px;margin:7px 0;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left;font-size:16px;cursor:pointer}.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;font-size:16px}.muted{color:var(--muted);font-size:13px}.dashHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.dashTitle{font-size:24px;font-weight:800}.backBtn{border:0;background:#eee;border-radius:10px;padding:9px 12px}.filters{display:flex;gap:7px;overflow:auto;margin:8px 0 14px}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.kpi{padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}.kpi b{display:block;font-size:23px;margin-top:5px}.section{margin-top:14px}.section h3{margin:0 0 9px}.chart{height:150px;display:flex;align-it const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const tu=tg?.initDataUnsafe?.user||{};let clientId=tu.id?String(tu.id):localStorage.getItem('fk_client_id');if(!clientId){clientId=String(Date.now())+String(Math.floor(Math.random()*100000));localStorage.setItem('fk_client_id',clientId)}function H(){const h={'Content-Type':'application/json','X-Telegram-User-Id':clientId};if(tg?.initData)h['X-Telegram-Init-Data']=tg.initData;return h}
const eq=['König','König хлеб','Rondo Чиабатта','Glimek','Rondo Smart Line','Rondo Croissomat','Compass'];const products=['Булочка бриошь зерновая','Булочка ржаная','Булочка с корицей','Булочка Сладкое сердце','Венгерская ватрушка','Круассан для сэндвича','Круассан классика мини 55 г','Круассан мини 50 г','Круассан французский 70 г','Круассан французский без дефроста','Круассан французский с сыром','Лепёшка сдобная','Лепёшка сдобная с сосиской','Начинка булочка с корицей','Начинка для пирожков с курицей и сыром','Начинка маковая для улитки','Основа для слойки с вишней','Пирожок с курицей и сыром','Рогалик вишнёвый','Слойка голландская','Слойка с вишней и заварным кремом','Слойка с марсельской сосиской','Слойка шоколад-апельсин','Творожные ушки','Трубочка','Улитка с изюмом','Улитка с маком','Хачапури','Хлеб Бородинский','Багет злаковый','Багет молочный','Багет ремесленный на опаре','Багет сырный','Батон классический','Бейгл с кунжутом','Булка Много мака','Булочка для гамбургера без кунжута','Булочка для супа тёмная','Булочка для френч-дога','Булочка для хот-дога белая','Булочка с маком','Булочка суповая светлая','Мини-чиабатта','Краюшки','Пирожок с капустой фреш','Пирожок с мясом фреш','Ромовая баба','Сочник с творогом','Хлеб бездрожжевой с семечками','Хлеб злаковый','Хлеб картофельный','Хлеб кефирный','Хлеб протеиновый','Хлеб пшеничный домашний','Хлеб с семенами чиа и пажитником','Хлеб тартин ржано-пшеничный','Хлеб тартин розовый','Хлеб тостовый молочный','Хлеб тостовый слоёный фреш','Хлеб тыквенный','Хлеб чесночный','Чиабатта пшеничная смесевая'];const reasons=['Поломка оборудования','Нет сырья','Нет персонала','Техническая проблема','Качество продукции','Нет инвентаря'];let s={};const C=()=>document.getElementById('content'),clear=()=>C().innerHTML='',B=(t,f,c='')=>{const b=document.createElement('button');b.type='button';b.className='btn '+c;b.textContent=t;b.addEventListener('click',f);return b},back=()=>C().append(B('← Назад',()=>{s={};render()})),pick=(k,v)=>{s[k]=v;render()},now=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
function render(){clear();document.getElementById('title').textContent='📊 ФК — производство';if(!s.event){C().append(document.createTextNode('Выберите действие'),B('🟢 Начало производства',()=>pick('event','start'),'primary'),B('🏁 Завершение производства',startFinish,'primary'),B('🔴 Критическая остановка',()=>pick('event','pause'),'danger'),B('📈 Аналитика',dashboard,'primary'));return}if(s.event==='finish'&&!s.openLoaded)return loadOpen();if(s.event==='finish'&&!s.openSelected)return renderOpen();if(!s.equipment){back();C().append(document.createTextNode('🏭 Выберите оборудование'));eq.forEach(x=>C().append(B(x,()=>pick('equipment',x))));return}if(s.event==='pause'&&!s.reason){back();C().append(document.createTextNode('❓ Причина остановки'));reasons.forEach(x=>C().append(B(x,()=>pick('reason',x))));return}if(s.event!=='pause'&&!s.product){back();const i=document.createElement('input');i.id='q';i.className='search';i.placeholder='Поиск продукции';i.addEventListener('input',search);C().append(i);const r=document.createElement('div');r.id='r';C().append(r);search();return}if(s.event==='start'&&!s.start){time('start','🕐 Начало производства');return}if(s.event==='pause'&&!s.start){time('start','🕐 Начало остановки');return}if(s.event==='pause'&&!s.end){time('end','🕐 Окончание остановки');return}if(s.event==='finish'&&!s.quantity){renderQuantity();return}if(s.event==='finish'&&!s.end){time('end','🕐 Окончание производства');return}confirmScreen()}
function startFinish(){s={event:'finish'};loadOpen()}function renderQuantity(){back();C().append(document.createTextNode('🏁 '+s.product),document.createElement('br'),document.createTextNode('🔢 Сколько штук произвели?'));const i=document.createElement('input');i.id='quantity';i.className='search';i.inputMode='numeric';i.placeholder='3000';C().append(i,B('Продолжить',()=>{const v=i.value.replace(/\s/g,'');if(!/^\d+$/.test(v)||+v<=0)return alert('Введите количество');s.quantity=v;render()},'primary'))}function time(k,t){back();C().append(document.createTextNode(t),B('🕐 Сейчас',()=>pick(k,now()),'primary'));const i=document.createElement('input');i.className='search';i.placeholder='08:30';C().append(i,B('Продолжить',()=>{if(!/^\d{1,2}:\d{2}$/.test(i.value))return alert('Формат 08:30');s[k]=i.value;render()}))}function search(){const q=(document.getElementById('q')?.value||'').toLowerCase(),r=document.getElementById('r');if(!r)return;r.innerHTML='';products.filter(x=>x.toLowerCase().includes(q)).forEach(x=>r.append(B('📦 '+x,()=>pick('product',x),'item')))}
async function loadOpen(){try{const r=await fetch('/api/open',{headers:H(),cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка доступа');s.open=x.items||[];s.openLoaded=true;s.openSelected=false;delete s.error;renderOpen()}catch(e){s.openLoaded=true;s.error=e.message;renderOpen()}}function selectOpen(x){s.openSelected=true;s.open_id=String(x.id);s.equipment=x.equipment;s.product=x.product;s.start=x.start_time;delete s.open;delete s.error;render()}function renderOpen(){clear();C().append(document.createTextNode('🏁 Выберите открытое производство'),document.createElement('br'));if(s.error){C().append(document.createTextNode('⚠️ '+s.error),B('← Назад',()=>{s={};render()}));return}if(!s.open?.length){C().append(document.createTextNode('Открытых производств нет.'));C().append(B('← Назад',()=>{s={};render()}));return}s.open.forEach(x=>C().append(B('📦 '+x.product+' · '+x.equipment+' · '+x.start_time,()=>selectOpen(x),'item')));C().append(B('← Назад',()=>{s={};render()}))}
function confirmScreen(){const text=s.event==='start'?`🟢 Начало: ${s.equipment} · ${s.product} · ${s.start}`:s.event==='pause'?`🔴 Остановка: ${s.equipment} · ${s.reason} · ${s.start}–${s.end}`:`🏁 Завершение: ${s.equipment} · ${s.product} · ${s.start}–${s.end} · ${Number(s.quantity).toLocaleString('ru-RU')} шт`;C().append(document.createTextNode('Проверьте запись'),document.createElement('br'),document.createTextNode(text),B('✅ Подтвердить',send,'primary'))}async function send(){try{const r=await fetch('/api/save',{method:'POST',headers:H(),body:JSON.stringify(s),cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка сохранения');s={};clear();C().append(document.createTextNode('✅ Запись сохранена'),document.createElement('br'),document.createTextNode('Итог отправлен в рабочую группу.'),B('Вернуться в меню',render,'primary'))}catch(e){clear();C().append(document.createTextNode('⚠️ Не удалось сохранить: '+e.message),B('← Назад',render))}}
function n(v){return Number(v||0).toLocaleString('ru-RU')}function mins(a,b){if(!a||!b)return 0;const p=x=>{const z=String(x).split(':').map(Number);return z[0]*60+z[1]};let d=p(b)-p(a);return d<0?d+1440:d}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function dashboard(){clear();document.getElementById('title').textContent='📈 Аналитика';C().innerHTML='<div class="loading">Загрузка аналитики…</div>';let key=localStorage.getItem('fk_dashboard_key')||prompt('Введите ключ аналитики');if(!key){return render()}localStorage.setItem('fk_dashboard_key',key.trim());try{const r=await fetch('/api/dashboard/all?api_key='+encodeURIComponent(key.trim()),{cache:'no-store'}),x=await r.json();if(r.status===401)throw Error('Неверный ключ аналитики');if(!r.ok)throw Error(x.error||'Ошибка API');drawDash(x)}catch(e){clear();C().append(document.createTextNode('⚠️ '+e.message),B('Повторить',dashboard,'primary'),B('← Назад',()=>{s={};render()}))}}
function drawDash(x){const p=x.production||[],q=x.pauses||[];const closed=p.filter(a=>a.status==='closed');const total=closed.reduce((z,a)=>z+Number(a.quantity||0),0);const cycles=closed.length;const durations=closed.map(a=>mins(a.start_time,a.end_time)).filter(Boolean);const avg=durations.length?durations.reduce((a,b)=>a+b,0)/durations.length:0;const stopDur=q.map(a=>mins(a.start_time,a.end_time)).filter(Boolean);const stop=stopDur.reduce((a,b)=>a+b,0);const byEq={};closed.forEach(a=>byEq[a.equipment]=(byEq[a.equipment]||0)+Number(a.quantity||0));const byProd={};closed.forEach(a=>byProd[a.product]=(byProd[a.product]||0)+Number(a.quantity||0));const byReason={};q.forEach(a=>byReason[a.reason]=(byReason[a.reason]||0)+mins(a.start_time,a.end_time));const eqs=Object.entries(byEq).sort((a,b)=>b[1]-a[1]);const prods=Object.entries(byProd).sort((a,b)=>b[1]-a[1]).slice(0,7);const rs=Object.entries(byReason).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...eqs.map(a=>a[1]));let h='<div class="filters"><button class="filter">Сегодня</button><button class="filter">7 дней</button><button class="filter">30 дней</button></div><div class="kpis"><div class="kpi">📦 Выпуск<div class="muted">закрытые циклы</div><b>'+n(total)+' шт.</b></div><div class="kpi">🔄 Циклы<div class="muted">завершено</div><b>'+n(cycles)+'</b></div><div class="kpi">⏱ Средний цикл<div class="muted">факт</div><b>'+Math.round(avg)+' мин</b></div><div class="kpi">🔴 Простои<div class="muted">за период</div><b>'+Math.floor(stop/60)+' ч '+(stop%60)+' мин</b></div></div>';h+='<div class="section"><h3>🏭 Выпуск по оборудованию</h3>';if(!eqs.length)h+='<div class="loading">Пока нет завершённых производств</div>';else{h+='<div class="chart">';eqs.forEach(a=>h+='<div class="bar" style="height:'+Math.max(8,Math.round(a[1]/max*115))+'px"><span>'+esc(a[0]).slice(0,9)+'</span></div>');h+='</div>';eqs.forEach(a=>h+='<div class="rank"><div class="rankTop"><span>'+esc(a[0])+'</span><span>'+n(a[1])+' шт.</span></div><div class="mete render();</script></body></html>
