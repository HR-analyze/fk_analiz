<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ФК — производство</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f4f5;color:#222}.app{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 12px #0001}.btn{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;background:#eee;font-size:16px;text-align:left;cursor:pointer}.btn:active{opacity:.7}.primary{background:#222;color:#fff}.danger{background:#f5dddd}.back{background:transparent}.search{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.item{padding:14px 4px;border-bottom:1px solid #eee;cursor:pointer}.muted,.small{color:#777}.small{font-size:13px}.err{background:#fee;padding:12px;border-radius:10px;margin:10px 0}.loading{padding:20px;text-align:center;color:#777}</style></head><body><div class="app"><div class="card"><h2>📊 ФК — производство</h2><div id="content"></div></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const initData=tg?.initData||'';const products={"Холодная формовка":["Булочка бриошь зерновая","Булочка ржаная","Булочка с корицей","Булочка Сладкое сердце","Венгерская ватрушка","Круассан для сэндвича","Круассан классика мини 55 г","Круассан мини 50 г","Круассан французский 70 г","Круассан французский без дефроста","Круассан французский с сыром","Лепёшка сдобная","Лепёшка сдобная с сосиской","Начинка булочка с корицей","Начинка для пирожков с курицей и сыром","Начинка маковая для улитки","Основа для слойки с вишней","Пирожок с курицей и сыром","Рогалик вишнёвый","Слойка голландская","Слойка с вишней и заварным кремом","Слойка с марсельской сосиской","Слойка шоколад-апельсин","Творожные ушки","Трубочка","Улитка с изюмом","Улитка с маком","Хачапури","Хлеб Бородинский"],"Тёплая формовка":["Багет злаковый","Багет молочный","Багет ремесленный на опаре","Багет сырный","Батон классический","Бейгл с кунжутом","Булка Много мака","Булочка для гамбургера без кунжута","Булочка для супа тёмная","Булочка для френч-дога","Булочка для хот-дога белая","Булочка с маком","Булочка суповая светлая","Мини-чиабатта","Краюшки","Пирожок с капустой фреш","Пирожок с мясом фреш","Ромовая баба","Сочник с творогом","Хлеб бездрожжевой с семечками","Хлеб злаковый","Хлеб картофельный","Хлеб кефирный","Хлеб протеиновый","Хлеб пшеничный домашний","Хлеб с семенами чиа и пажитником","Хлеб тартин ржано-пшеничный","Хлеб тартин розовый","Хлеб тостовый молочный","Хлеб тостовый слоёный фреш","Хлеб тыквенный","Хлеб чесночный","Чиабатта пшеничная смесевая"]};const equipment=['cromaster','starline','Glimek','König / König хлеб','Rondo','Trima'];const reasons=['Поломка оборудования','Нет сырья','Нет персонала','Техническая проблема','Качество продукции'];let s={};
function button(text,action,cls=''){const b=document.createElement('button');b.type='button';b.className='btn '+cls;b.textContent=text;b.addEventListener('click',action);return b}function content(){return document.getElementById('content')}function clear(){content().innerHTML=''}function addBack(){content().append(button('← Назад',()=>{s={};render()},'back'))}function pick(k,v){s[k]=v;render()}function now(){return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',hour12:false})}
function render(){clear();if(!s.event){content().append(document.createTextNode('Выберите действие'));content().append(button('🟢 Начало производства',()=>pick('event','start'),'primary'),button('🏁 Завершение производства',()=>pick('event','finish'),'primary'),button('🔴 Критическая остановка',()=>pick('event','pause'),'danger'));return}if(s.event==='finish'&&!s.openLoaded){loadOpen();return}if(!s.equipment){addBack();content().append(document.createTextNode('🏭 Выберите оборудование'));equipment.forEach(x=>content().append(button(x,()=>pick('equipment',x))));content().append(button('✏️ Другое',()=>custom('equipment')));return}if(s.event==='pause'&&!s.reason){addBack();content().append(document.createTextNode('❓ Причина остановки'));reasons.forEach(x=>content().append(button(x,()=>pick('reason',x))));content().append(button('✏️ Другая причина',()=>custom('reason')));return}if(s.event!=='pause'&&!s.group){addBack();content().append(document.createTextNode('📦 Вид формовки'));Object.keys(products).forEach(x=>content().append(button(x,()=>pick('group',x))));return}if(s.event!=='pause'&&!s.product){addBack();const q=document.createElement('input');q.id='q';q.className='search';q.placeholder='хлеб, круассан, бейгл';q.addEventListener('input',search);content().append(document.createTextNode('🔎 Найдите продукцию'),q);const r=document.createElement('div');r.id='results';content().append(r);search();return}if(s.event==='pause'&&!s.start){time('start','🕐 Начало остановки');return}if(s.event==='pause'&&!s.end){time('end','🕐 Окончание остановки');return}if(s.event==='start'&&!s.start){time('start','🕐 Начало производства');return}if(s.event==='finish'&&!s.end){time('end','🕐 Время завершения');return}if(s.event==='finish'&&!s.quantity){addBack();content().append(document.createTextNode('🔢 Сколько штук произвели?'));const q=document.createElement('input');q.id='quantity';q.className='search';q.inputMode='numeric';q.placeholder='3000';content().append(q,button('Продолжить',()=>manual('quantity'),'primary'));return}content().append(document.createTextNode('Проверьте запись'));content().append(document.createElement('br'),document.createTextNode(summary()),button('✅ Подтвердить',send,'primary'),button('✏️ Начать заново',()=>{s={};render()}))}
function time(k,title){addBack();content().append(document.createTextNode(title),button('🕐 Сейчас',()=>pick(k,now()),'primary'));const i=document.createElement('input');i.id=k+'Input';i.className='search';i.placeholder='08:30';content().append(i,button('Продолжить',()=>manual(k)))}function manual(k){const i=document.getElementById(k+'Input')||document.getElementById(k),v=i?.value.trim();if(k==='quantity'){if(!/^\d+$/.test(v)||+v<=0)return alert('Введите положительное количество цифрами');s[k]=v.replace(/\s/g,'')}else{if(!/^\d{1,2}:\d{2}$/.test(v))return alert('Введите время в формате 08:30');s[k]=v}render()}
function custom(k){const v=prompt(k==='equipment'?'Название оборудования:':'Причина остановки:');if(v?.trim())pick(k,v.trim())}function search(){const q=(document.getElementById('q')?.value||'').toLowerCase(),r=document.getElementById('results');if(!r)return;r.innerHTML='';(products[s.group]||[]).filter(x=>x.toLowerCase().includes(q)).slice(0,15).forEach(x=>{const d=document.createElement('div');d.className='item';d.textContent=x;d.addEventListener('click',()=>pick('product',x));r.append(d)})}
async function loadOpen(){s.openLoaded=true;try{if(!initData)throw Error('Telegram initData не получен.');const r=await fetch('/api/open?initData='+encodeURIComponent(initData));const x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка доступа');s.open=x.items||[]}catch(e){s.loadError=e.message}renderOpen()}function renderOpen(){clear();if(s.loadError){content().append(document.createTextNode('⚠️ Не удалось получить открытые производства: '+s.loadError));addBack();return}if(!s.open.length){addBack();content().append(document.createTextNode('Открытых производств нет.'));content().append(button('🟢 Начать новое',()=>{s={event:'start'};render()},'primary'));return}addBack();content().append(document.createTextNode('🏁 Ваши открытые производства'));s.open.forEach((x,i)=>content().append(button('📦 '+x.product+' — '+x.equipment+' · '+x.start_time,()=>selectOpen(i))))}function selectOpen(i){const x=s.open[i];s={event:'finish',open_id:x.id,equipment:x.equipment,group:x.forming,product:x.product,start:x.start_time,end:now()};render()}
function summary(){if(s.event==='pause')return `🔴 Критическая остановка — ${s.equipment} — ${s.reason} — ${s.start}–${s.end}`;if(s.event==='start')return `🟢 Начало производства — ${s.equipment} — ${s.product} — ${s.start}`;return `🏁 Завершение — ${s.equipment} — ${s.product} — ${s.start}–${s.end} — ${Number(s.quantity).toLocaleString('ru-RU')} шт`}async function send(){try{if(!initData)throw Error('Telegram initData не получен.');const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:JSON.stringify(s)});const x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка сохранения');s={};content().innerHTML='<h3>✅ Готово</h3><p>Запись сохранена и опубликована.</p>';content().append(button('Вернуться в меню',()=>render(),'primary'))}catch(e){content().innerHTML='<div class="err">⚠️ Не удалось сохранить: '+e.message+'</div>';content().append(button('← Назад',()=>render(),'back'))}}render();
</script></body></html>
