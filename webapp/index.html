<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ФК — производство</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}.app{max-width:560px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 12px #0001}.btn{width:100%;padding:15px;margin:7px 0;border:0;border-radius:12px;background:#eee;font-size:16px;text-align:left}.primary{background:#222;color:#fff}.danger{background:#f5dddd}.back{background:transparent;padding:8px 0}.search,.input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.item{padding:14px 4px;border-bottom:1px solid #eee;cursor:pointer}.muted{color:#777}.small{font-size:13px;color:#777}</style></head><body><div class="app"><div class="card"><h2>📊 ФК — производство</h2><div id="content"></div></div></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const products={"Холодная формовка":["Булочка бриошь зерновая","Булочка ржаная","Булочка с корицей","Булочка Сладкое сердце","Венгерская ватрушка","Круассан для сэндвича","Круассан классика мини 55 г","Круассан мини 50 г","Круассан французский 70 г","Круассан французский без дефроста","Круассан французский с сыром","Лепёшка сдобная","Лепёшка сдобная с сосиской","Начинка булочка с корицей","Начинка для пирожков с курицей и сыром","Начинка маковая для улитки","Основа для слойки с вишней и заварным кремом","Пирожок с курицей и сыром","Рогалик вишнёвый","Слойка голландская","Слойка с вишней и заварным кремом","Слойка с марсельской сосиской","Слойка шоколад-апельсин","Творожные ушки","Трубочка","Улитка с изюмом","Улитка с маком","Хачапури","Хлеб Бородинский"],"Тёплая формовка":["Багет злаковый","Багет молочный","Багет ремесленный на опаре","Багет сырный","Батон классический","Бейгл с кунжутом","Булка Много мака","Булочка для гамбургера без кунжута","Булочка для супа тёмная","Булочка для френч-дога","Булочка для хот-дога белая","Булочка с маком","Булочка суповая светлая","Мини-чиабатта","Краюшки","Пирожок с капустой фреш","Пирожок с мясом фреш","Ромовая баба","Сочник с творогом","Хлеб бездрожжевой с семечками","Хлеб злаковый","Хлеб картофельный","Хлеб кефирный","Хлеб протеиновый","Хлеб пшеничный домашний","Хлеб с семенами чиа и пажитником","Хлеб тартин ржано-пшеничный","Хлеб тартин розовый","Хлеб тостовый молочный","Хлеб тостовый слоёный фреш","Хлеб тыквенный","Хлеб чесночный","Чиабатта пшеничная смесевая"]};
const equipment=['cromaster','starline','Glimek','König / König хлеб','Rondo','Trima'];const reasons=['Поломка оборудования','Нет сырья','Нет персонала','Техническая проблема','Качество продукции'];let s={};
const B=(t,f,c='')=>`<button class="btn ${c}" onclick="${f}">${t}</button>`;const N=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',hour12:false});const pick=(k,v)=>{s[k]=v;render()};const reset=()=>{s={};render()};
function render(){let c=document.getElementById('content');if(!s.event){c.innerHTML='<p>Выберите действие</p>'+B('🟢 Начало производства',"pick('event','start')",'primary')+B('🏁 Завершение производства',"pick('event','finish')",'primary')+B('🔴 Критическая остановка',"pick('event','pause')",'danger');return}if(s.event==='finish'&&!s.openLoaded){loadOpen();return}if(!s.equipment){c.innerHTML=B('← Назад','reset()','back')+'<p>🏭 Выберите оборудование</p>'+equipment.map(x=>B(x,`pick('equipment',${JSON.stringify(x)})`)).join('')+B('✏️ Другое',"custom('equipment')");return}if(s.event==='pause'&&!s.reason){c.innerHTML=B('← Назад','reset()','back')+'<p>❓ Причина остановки</p>'+reasons.map(x=>B(x,`pick('reason',${JSON.stringify(x)})`)).join('')+B('✏️ Другая причина',"custom('reason')");return}if(s.event!=='pause'&&!s.group){c.innerHTML=B('← Назад','reset()','back')+'<p>📦 Вид формовки</p>'+Object.keys(products).map(x=>B(x,`pick('group',${JSON.stringify(x)})`)).join('');return}if(s.event!=='pause'&&!s.product){c.innerHTML=B('← Назад','reset()','back')+'<p>🔎 Найдите продукцию</p><input id="q" class="search" placeholder="хлеб, круассан, бейгл" oninput="search()"><div id="results"></div>';return}if(s.event==='pause'&&!s.start){timeScreen('start','🕐 Начало остановки','start');return}if(s.event==='pause'&&!s.end){timeScreen('end','🕐 Окончание остановки','end');return}if(s.event==='start'&&!s.start){timeScreen('start','🕐 Начало производства','start');return}if(s.event==='finish'&&!s.end){timeScreen('end','🕐 Время завершения','end');return}if(s.event==='finish'&&!s.quantity){c.innerHTML=B('← Назад','reset()','back')+'<p>🔢 Сколько штук произвели?</p><input id="quantity" class="search" inputmode="numeric" placeholder="3000">'+B('Продолжить',"manual('quantity')",'primary');return}c.innerHTML='<p><b>Проверьте запись</b></p>'+summary()+B('✅ Подтвердить', 'send()','primary')+B('✏️ Начать заново','reset()')}
function timeScreen(k,title,id){let c=document.getElementById('content');c.innerHTML=B('← Назад','reset()','back')+`<p>${title}</p>`+B('🕐 Сейчас',`pick('${k}',N())`,'primary')+`<input id="${id}" class="search" placeholder="08:30">`+B('Продолжить',`manual('${k}')`)}
function loadOpen(){s.openLoaded=true;fetch('/api/open?user_id='+(tg?.initDataUnsafe?.user?.id||'')).then(r=>r.json()).then(x=>{s.open=x.items||[];renderOpen()}).catch(()=>{s.open=[];renderOpen()})}function renderOpen(){let c=document.getElementById('content');if(!s.open.length){c.innerHTML=B('← Назад','reset()','back')+'<p>Открытых производств нет.</p>'+B('🟢 Начать новое',"s={event:'start'};render()",'primary');return}c.innerHTML=B('← Назад','reset()','back')+'<p>🏁 <b>Ваши открытые производства</b></p>'+s.open.map((x,i)=>B(`📦 ${x.product}<br><span class="small">🏭 ${x.equipment} · начало ${x.start}</span>`,`selectOpen(${i})`)).join('')+B('🆕 Начать новое',"s={event:'start'};render()")}
function selectOpen(i){let x=s.open[i];s={event:'finish',open_id:x.id,equipment:x.equipment,forming:x.forming,product:x.product,start:x.start,end:N(),quantity:null};render()}
function search(){let q=(document.getElementById('q').value||'').toLowerCase();document.getElementById('results').innerHTML=(products[s.group]||[]).filter(x=>x.toLowerCase().includes(q)).slice(0,15).map(x=>`<div class="item" onclick="pick('product',${JSON.stringify(x)})">${x}</div>`).join('')||'<p class="muted">Не нашли. Попробуйте другое слово.</p>'}function custom(k){let v=prompt(k==='equipment'?'Название оборудования:':'Причина остановки:');if(v?.trim())pick(k,v.trim())}function manual(k){let el=document.getElementById(k),v=(el.value||'').trim();if(k==='quantity'){v=v.replace(/\s/g,'');if(!/^\d+$/.test(v)||+v<=0){alert('Введите положительное количество цифрами');return}}else if(!/^\d{1,2}:\d{2}$/.test(v)){alert('Введите время в формате 08:30');return}s[k]=v;render()}function summary(){if(s.event==='pause')return `🔴 <b>Критическая остановка</b><br>🏭 ${s.equipment}<br>❗ ${s.reason}<br>🕐 ${s.start}–${s.end}`;if(s.event==='start')return `🟢 <b>Начало производства</b><br>🏭 ${s.equipment}<br>📦 ${s.product}<br>🕐 ${s.start}`;return `🏁 <b>Завершение производства</b><br>🏭 ${s.equipment}<br>📦 ${s.product}<br>🕐 ${s.start}–${s.end}<br>🔢 ${Number(s.quantity).toLocaleString('ru-RU')} шт`}function send(){if(!tg?.sendData){alert('Приложение открыто не из Telegram');return}tg.sendData(JSON.stringify(s));document.getElementById('content').innerHTML='<h3>✅ Готово</h3><p>Итог отправлен в рабочий чат.</p>'}render();</script></body></html>
