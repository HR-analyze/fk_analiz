<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ФК — Аналитика</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#18202a;--muted:#697386;--line:#e5e9ef;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title{font-size:28px;font-weight:800}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px}.btn,.select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font:inherit}.btn{cursor:pointer}.filters{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}.select{width:100%}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 10px #1720330a}.label{color:var(--muted);font-size:13px}.value{font-size:25px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}.section-title{font-size:17px;font-weight:750;margin-bottom:12px}.bars{display:flex;align-items:end;height:210px;gap:10px;border-bottom:1px solid var(--line);padding:10px 5px}.barwrap{height:100%;flex:1;display:flex;align-items:end;justify-content:center;position:relative}.bar{width:60%;min-height:3px;background:var(--blue);border-radius:7px 7px 2px 2px}.barlabel{position:absolute;bottom:-22px;font-size:11px;color:var(--muted);white-space:nowrap}.rank{padding:11px 0;border-bottom:1px solid var(--line)}.rank:last-child{border-bottom:0}.rankline{display:flex;justify-content:space-between;gap:10px}.meter{height:7px;background:#edf0f4;border-radius:9px;margin-top:7px;overflow:hidden}.meter i{display:block;height:100%;background:var(--blue);border-radius:9px}.stops{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stop{padding:11px;background:#fafbfc;border:1px solid var(--line);border-radius:12px}.stop b{display:block;margin-top:4px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:12px;font-weight:600}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef4ff;color:var(--blue);font-size:12px}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:800px){.wrap{padding:12px}.kpis{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.title{font-size:23px}}@media(max-width:500px){.filters{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.stops{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><div class="title">📈 Производство</div><div class="sub">Операционная аналитика · живые данные PostgreSQL</div></div><div class="actions"><button class="btn" onclick="load()">↻ Обновить</button></div></header><section class="filters"><select id="period" class="select" onchange="render()"><option value="today">Сегодня</option><option value="7">Последние 7 дней</option><option value="30">Последние 30 дней</option><option value="all">Весь период</option></select><select id="equipment" class="select" onchange="render()"><option value="all">Все оборудование</option></select><select id="product" class="select" onchange="render()"><option value="all">Все продукты</option></select><select id="status" class="select" onchange="render()"><option value="closed">Завершённые</option><option value="all">Все записи</option></select></section><section id="kpis" class="kpis"></section><div class="grid"><section class="card"><div class="section-title">🏭 Выпуск по оборудованию</div><div id="eqChart"></div></section><section class="card"><div class="section-title">🛑 Простои по причинам</div><div id="stops" class="stops"></div></section></div><div class="grid"><section class="card"><div class="section-title">📦 Продукция</div><div id="products"></div></section><section class="card"><div class="section-title">⏱ Тайминги</div><div id="timings"></div></section></div><section class="card" style="margin-top:12px"><div class="section-title">🔎 Детализация</div><div id="detail"></div></section></main><script>let data=null,key=localStorage.getItem('fk_dashboard_key')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const num=x=>Number(x||0).toLocaleString('ru-RU');const mins=(a,b)=>{if(!a||!b)return 0;const p=x=>{let z=String(x).split(':').map(Number);return z[0]*60+z[1]};let d=p(b)-p(a);return d<0?d+1440:d};const hm=m=>{m=Math.round(m||0);return m<60?m+' мин':Math.floor(m/60)+' ч '+m%60+' мин'};function since(){let v=document.getElementById('period').value;if(v==='all')return '';let d=new Date();if(v==='today')return d.toISOString().slice(0,10);d.setDate(d.getDate()-Number(v)+1);return d.toISOString().slice(0,10)}async function load(){if(!key){key=prompt('Введите ключ аналитики')||'';if(!key)return;key=key.trim();localStorage.setItem('fk_dashboard_key',key)}try{let r=await fetch('/api/dashboard/all?api_key='+encodeURIComponent(key),{cache:'no-store'});if(r.status===401){localStorage.removeItem('fk_dashboard_key');key='';throw Error('Неверный ключ аналитики')}if(!r.ok)throw Error('Ошибка API');data=await r.json();fillFilters();render()}catch(e){document.getElementById('kpis').innerHTML='<div class="card" style="grid-column:1/-1">⚠️ '+esc(e.message)+'</div>'}}function fillFilters(){let eq=[...new Set((data.production||[]).map(x=>x.equipment).filter(Boolean))].sort();let pr=[...new Set((data.production||[]).map(x=>x.product).filter(Boolean))].sort();let e=document.getElementById('equipment'),p=document.getElementById('product');e.innerHTML='<option value="all">Все оборудование</option>'+eq.map(x=>'<option>'+esc(x)+'</option>').join('');p.innerHTML='<option value="all">Все продукты</option>'+pr.map(x=>'<option>'+esc(x)+'</option>').join('')}function filtered(){let from=since(),eq=document.getElementById('equipment').value,pr=document.getElementById('product').value,status=document.getElementById('status').value;let p=(data.production||[]).filter(x=>(!from||String(x.created_at||'').slice(0,10)>=from)&&(eq==='all'||x.equipment===eq)&&(pr==='all'||x.product===pr)&&(status==='all'||x.status==='closed'));let q=(data.pauses||[]).filter(x=>(!from||String(x.created_at||'').slice(0,10)>=from)&&(eq==='all'||x.equipment===eq));return{p,q}}function render(){if(!data)return;let {p,q}=filtered(),closed=p.filter(x=>x.status==='closed'),total=closed.reduce((s,x)=>s+Number(x.quantity||0),0),ds=closed.map(x=>mins(x.start_time,x.end_time)).filter(Boolean),avg=ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:0,stop=q.map(x=>mins(x.start_time,x.end_time)).reduce((a,b)=>a+b,0),rate=avg?total/(avg/60):0;document.getElementById('kpis').innerHTML=[['📦','Выпуск',num(total)+' шт'],['🔄','Циклы',num(closed.length)],['⏱','Средний цикл',hm(avg)],['⚡','Средняя производительность',num(Math.round(rate))+' шт/ч'],['🛑','Простои',hm(stop)]].map(x=>'<div class="card"><div class="label">'+x[0]+' '+x[1]+'</div><div class="value">'+x[2]+'</div></div>').join('');let eq={};closed.forEach(x=>eq[x.equipment]=(eq[x.equipment]||0)+Number(x.quantity||0));let es=Object.entries(eq).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...es.map(x=>x[1]));document.getElementById('eqChart').innerHTML=es.length?'<div class="bars">'+es.map(x=>'<div class="barwrap"><div class="bar" style="height:'+Math.max(3,x[1]/mx*175)+'px"></div><div class="barlabel">'+esc(x[0])+'</div></div>').join('')+'</div>':'<div class="empty">Нет данных</div>';let rs={};q.forEach(x=>rs[x.reason]=(rs[x.reason]||0)+mins(x.start_time,x.end_time));let rr=Object.entries(rs).sort((a,b)=>b[1]-a[1]);document.getElementById('stops').innerHTML=rr.length?rr.map(x=>'<div class="stop"><span>'+esc(x[0])+'</span><b>'+hm(x[1])+'</b></div>').join(''):'<div class="empty">Остановок нет</div>';let pr={};closed.forEach(x=>{let k=x.product||'Без продукта';if(!pr[k])pr[k]={q:0,n:0,t:0};pr[k].q+=Number(x.quantity||0);pr[k].n++;pr[k].t+=mins(x.start_time,x.end_time)});let ps=Object.entries(pr).sort((a,b)=>b[1].q-a[1].q).slice(0,10),pm=Math.max(1,...ps.map(x=>x[1].q));document.getElementById('products').innerHTML=ps.length?ps.map((x,i)=>'<div class="rank"><div class="rankline"><span><b>'+(i+1)+'.</b> '+esc(x[0])+'</span><b>'+num(x[1].q)+' шт</b></div><div class="meter"><i style="width:'+x[1].q/pm*100+'%"></i></div><div class="sub">'+x[1].n+' циклов · '+hm(x[1].n?x[1].t/x[1].n:0)+'</div></div>').join(''):'<div class="empty">Нет данных</div>';let ts=ps.map(x=>[x[0],x[1].n?x[1].t/x[1].n:0,x[1].q]);document.getElementById('timings').innerHTML=ts.length?'<table class="table"><tr><th>Продукт</th><th>Средний цикл</th><th>Выпуск</th></tr>'+ts.map(x=>'<tr><td>'+esc(x[0])+'</td><td><span class="pill">'+hm(x[1])+'</span></td><td>'+num(x[2])+'</td></tr>').join('')+'</table>':'<div class="empty">Нет данных</div>';let rows=[...p].sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,50);document.getElementById('detail').innerHTML=rows.length?'<div style="overflow:auto"><table class="table"><tr><th>Дата</th><th>Оборудование</th><th>Продукт</th><th>Старт</th><th>Финиш</th><th>Время</th><th>Количество</th></tr>'+rows.map(x=>'<tr><td>'+esc(String(x.created_at||'').slice(0,10))+'</td><td>'+esc(x.equipment)+'</td><td>'+esc(x.product)+'</td><td>'+esc(x.start_time)+'</td><td>'+esc(x.end_time||'—')+'</td><td>'+hm(mins(x.start_time,x.end_time))+'</td><td>'+num(x.quantity)+'</td></tr>').join('')+'</table></div>':'<div class="empty">Нет данных</div>'}load();</script></body></html>
